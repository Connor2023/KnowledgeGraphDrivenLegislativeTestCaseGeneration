[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-testgen"
version = "0.1.0"
description = "Generate Gherkin compliance test cases from privacy legislation, using a Neo4j knowledge graph for supplementary context."
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.20",
    "numpy>=1.26",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "truststore>=0.9",
]

[project.scripts]
kg-testgen = "kg_testgen.cli:main"

[tool.setuptools]
packages = ["kg_testgen"]
