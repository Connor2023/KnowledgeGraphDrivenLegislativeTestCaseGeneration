id: https://w3id.org/ontogpt/app_norm
name: app_norm
title: Australian Privacy Principles Norm Extraction
description: >-
  Extracts deontic norms from provisions of Schedule 1 of the Privacy Act 1988 (Cth).

  The target is everything a flat (subject, predicate, object) triple destroys. An
  extraction that yields "APP entity - holds - personal information" has thrown away the
  modality, the condition and the exception, which is the entire testable content of a
  legislative provision. Each Norm below therefore keeps modality, bearer, action,
  object, conditions, exceptions and scope as separate fields.

  Norm, Condition and Exemption derive from CompoundExpression rather than NamedEntity:
  they are structured objects, not grounded terms. The entity-like slots (actor, action,
  information type) are NamedEntity but carry no `annotators`, so no ontology grounding
  is attempted -- the bundled annotators are biomedical and irrelevant here.

  NOTE on the class named Exemption: it cannot be called Exception, because LinkML then
  generates a Pydantic class shadowing the Python builtin and every provision that
  actually populates the field dies on an isinstance check.

license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  app_norm: https://w3id.org/ontogpt/app_norm/

default_prefix: app_norm
default_range: string

imports:
  - linkml:types
  - core

classes:

  ProvisionExtraction:
    tree_root: true
    description: >-
      All the normative content of a single subclause of Schedule 1.
    attributes:
      provision_id:
        description: >-
          The subclause identifier this text is, e.g. "2.2" or "6.1". Take it from the
          text itself; do not infer one that is not present.
      norms:
        description: >-
          Every distinct rule stated by this provision, as a semicolon-separated list.
          A provision with two exception limbs that operate independently states two
          norms, not one.

          CRITICAL: each entry is read later ON ITS OWN, with the rest of this provision
          removed, so every entry must be a self-contained sentence. Where the provision's
          opening words set up framing that governs all the limbs -- "Subclause 2.1 does
          not apply if", "the entity must not use or disclose the information unless",
          "This subclause applies in relation to the use or disclosure if" -- REPEAT that
          framing inside every entry. An entry reading only "it is impracticable for the
          APP entity to deal with individuals" is useless, because nothing in it reveals
          that it is an exception disapplying another subclause. Write instead
          "Subclause 2.1 does not apply if it is impracticable for the APP entity to deal
          with individuals who have not identified themselves".
        range: Norm
        multivalued: true
      disapplies:
        description: >-
          Any provision this one switches OFF, as a semicolon-separated list of subclause
          identifiers. For example a provision beginning "Subclause 2.1 does not apply
          if" disapplies 2.1. Leave blank if it disapplies nothing.
        multivalued: true
      cross_references:
        description: >-
          Every other provision this one refers to, as a semicolon-separated list of
          identifiers, e.g. "6.2; 6.3" or "Australian Privacy Principle 3". Include only
          provision identifiers, not sources of law such as "Australian law". Leave blank
          if there are none.
        multivalued: true

  Norm:
    is_a: CompoundExpression
    description: >-
      One rule: who must or may do what, under which conditions, subject to which
      exceptions. Use the literal words of the text for each field.
    attributes:
      deontic_modality:
        description: >-
          The normative force. "must" is an OBLIGATION; "must not" is a PROHIBITION;
          "may" or "is authorised to" is a PERMISSION. If the provision's own work is to
          switch another provision OFF -- it says some other subclause "does not apply"
          -- then it is a DISAPPLICATION, whatever verbs appear in its limbs. If it
          merely states that other provisions apply, or is purely definitional, it is
          NONE.
        range: DeonticModality
      bearer:
        description: >-
          The party on whom the norm falls, e.g. "APP entity", "organisation", "agency".
        range: Actor
      action:
        description: >-
          The regulated act, as a verb phrase, e.g. "use or disclose", "destroy",
          "de-identify", "deal with individuals who have identified themselves".
        range: Action
      object:
        description: >-
          What the action is performed on, e.g. "personal information", "sensitive
          information", "biometric information".
        range: InformationType
      conditions:
        description: >-
          The circumstances that must hold for this norm to apply at all, as a
          semicolon-separated list. These are triggers, not exceptions. A norm reading
          "if an entity holds information collected for a primary purpose, it must not
          use it for a secondary purpose" has both of those circumstances as conditions.
        range: Condition
        multivalued: true
      exceptions:
        description: >-
          The circumstances that switch this norm OFF, as a semicolon-separated list.
          Anything introduced by "unless", "does not apply if" or "other than" is an
          exception, not a condition. If the text contains such a clause you MUST return
          an entry here -- a norm stating "must not X unless Y" always has Y as an
          exception.
        range: Exemption
        multivalued: true
      scope_qualifier:
        description: >-
          Any limit on the norm's reach, e.g. "in relation to that matter", "as soon as
          practicable", "within a reasonable period". Leave blank if unqualified.

  Condition:
    is_a: CompoundExpression
    description: >-
      A circumstance that must hold for a norm to apply.
    attributes:
      statement:
        description: The condition in a single clause, as stated in the text.
      source_provision:
        description: >-
          The identifier of the provision that supplies this condition when the text
          points elsewhere for it, e.g. "4.3". Blank when the condition is stated here.

  Exemption:
    is_a: CompoundExpression
    description: >-
      A circumstance that disapplies a norm.
    attributes:
      statement:
        description: The exception in a single clause, as stated in the text.
      source_provision:
        description: >-
          The identifier of the provision that supplies this exception, e.g. "6.2" or
          "6.2(b)". Blank when the exception is stated here in full.
      is_exhaustive:
        description: >-
          "true" if the text signals these are the only exceptions, otherwise blank.

  Actor:
    is_a: NamedEntity
    description: A party a norm can bind, such as an APP entity, an agency or an individual.

  Action:
    is_a: NamedEntity
    description: A regulated act, such as collecting, using, disclosing or destroying.

  InformationType:
    is_a: NamedEntity
    description: A category of information, such as personal or sensitive information.

enums:

  DeonticModality:
    description: The normative force of a rule.
    permissible_values:
      OBLIGATION:
        description: A duty to act. Signalled by "must", "is required to", "shall".
      PROHIBITION:
        description: A duty to refrain. Signalled by "must not", "is prohibited from".
      PERMISSION:
        description: A liberty. Signalled by "may", "is authorised to", "is permitted to".
      DISAPPLICATION:
        description: >-
          The provision's function is to switch another provision off -- it states that
          some other subclause "does not apply" in stated circumstances. APP 2.2 is the
          type case: it imposes no duty of its own, it defeats the duty in 2.1.
      APPLICABILITY:
        description: >-
          The provision commands nothing itself; it supplies the conditions under which
          an exception referenced by ANOTHER provision is satisfied. Signalled by "This
          subclause applies in relation to X if". APP 6.2 is the type case: it does not
          permit secondary use, it defines when 6.1's "unless" is met. Do not label these
          PERMISSION -- an entity can satisfy 6.2 and still breach 6.1.
      NONE:
        description: >-
          The provision states no duty, liberty or disapplication of its own -- it is
          definitional, or it only says that other provisions apply. APP 4.4 is the type
          case: it switches APPs 5 to 13 on without itself commanding anything.
